name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: python -B -m unittest discover -v
      - name: Compile Python sources
        run: python -B -m compileall -q core desktop scripts tests
      - name: Check browser JavaScript
        run: node --check web/app.js
