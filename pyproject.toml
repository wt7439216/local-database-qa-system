# P5: single source of truth for project metadata, dependency groups and tool
# configuration.  The runtime itself stays **standard-library only**; every
# third-party package is an explicit optional extra.
#
#   pip install -e ".[dev,modern]"      # local development / CI
#   pip install -e ".[ingest]"          # five-format document ingestion
#   pip install -e ".[build]"           # Windows PyInstaller candidate
#   pip install -e ".[sidecar]"         # optional reranker service (own venv)
#
# requirements*.txt remain as frozen, directly-installable mirrors for the
# build scripts that predate this file; scripts/verify_all.py checks that they
# stay in sync with the groups below.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-database-qa"
version = "4.0.0a3"
description = "Fully local, offline question answering over textbooks and general documents"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "coverage>=7.0",
    "pytest>=8.0",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
]
modern = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
ingest = [
    "PyMuPDF>=1.24,<2",
    "rapidocr-onnxruntime>=1.4,<2",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
]
build = [
    "pyinstaller==6.21.0",
    "PyMuPDF>=1.24,<2",
    "rapidocr-onnxruntime>=1.4,<2",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
]
sidecar = [
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]

[project.urls]
Repository = "https://github.com/wt7439216/local-database-qa-system"

# This project runs from the source tree; no importable wheel is published.
# Editable installs only put the repository root on sys.path and install the
# optional dependency groups above.
[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing core packages on purpose.
"scripts/*" = ["E402"]

[tool.coverage.run]
branch = true
source = ["core", "desktop"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
