# Keep the CI gate focused on real defects (unused/undefined names, bare
# except, duplicate definitions); formatting style is intentionally unchecked.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Scripts bootstrap sys.path before importing core packages on purpose.
"scripts/*" = ["E402"]
