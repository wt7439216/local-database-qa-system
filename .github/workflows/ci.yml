name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        # 3.13 只跑源码门禁；Windows EXE 构建仍固定 3.12（RapidOCR 1.4 无 3.13 wheel）。
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 依赖单一真源是 pyproject.toml；RapidOCR 单独排除（无 3.13 wheel）。
      - name: Install dependencies
        run: python -m pip install "setuptools>=68" -e ".[dev,modern]" "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2"
      # P5 单一验收入口 = `make check`：check_all 的 10 项 + 双栈契约 + EXE 校验 + git 状态。
      - name: Run full check suite
        run: python -X utf8 scripts/verify_all.py
