name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # rapidocr-onnxruntime has no Python 3.13 wheel, so install only the
      # parser dependencies the test suite actually exercises (same version
      # ranges as requirements-ingest.txt).
      - name: Install ingestion dependencies
        run: |
          python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2"
      - name: Lint Python sources
        run: |
          python -m pip install ruff
          python -m ruff check core desktop scripts tests
      - name: Run unit tests
        run: python -B -m unittest discover -v
      - name: Compile Python sources
        run: python -B -m compileall -q core desktop scripts tests
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/library.js
          node --check web/markdown.js
